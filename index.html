<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Own Unique BigHead Character! | Big Head Billionaires</title>
    <meta name="description" content="Dress up and customize your BigHead character with hundreds of options! Choose from 30+ eyes, 28+ mouths, 57+ heads, 52+ outfits, textures, body styles, and backgrounds. Mix and match categories to create your perfect unique character design and export as PNG.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="ASSETS/favicon.png">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Create Your Own Unique BigHead Character! | Big Head Billionaires">
    <meta property="og:description" content="Dress up and customize your BigHead character with hundreds of options! Choose from 30+ eyes, 28+ mouths, 57+ heads, 52+ outfits, textures, body styles, and backgrounds.">
    <meta property="og:image" content="ASSETS/thumbnail.png">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Create Your Own Unique BigHead Character! | Big Head Billionaires">
    <meta name="twitter:description" content="Dress up and customize your BigHead character with hundreds of options! Mix and match to create your perfect unique design.">
    <meta name="twitter:image" content="ASSETS/thumbnail.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: linear-gradient(135deg, #2d3250 0%, #1f2937 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        h1 {
            text-align: center;
            color: #e0e7ff;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .main-content {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .viewing-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 20px;
        }

        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
            border: 3px solid #8b5cf6;
            border-radius: 15px;
            overflow: hidden;
            background: #1e293b;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.2);
        }

        /* Mobile toggle button */
        .mobile-toggle {
            display: none;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s;
        }

        .mobile-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.6);
        }

        .mobile-toggle.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .export-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4), 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.6), 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .export-btn:active {
            transform: translateY(0);
        }

        .categories-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 700px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .categories-panel::-webkit-scrollbar {
            width: 8px;
        }

        .categories-panel::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }

        .categories-panel::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        .categories-panel::-webkit-scrollbar-thumb:hover {
            background: #a78bfa;
        }

        .category {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .category:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .category-header {
            font-weight: bold;
            color: #c4b5fd;
            margin-bottom: 10px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .category-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-preview {
            width: 80px;
            height: 80px;
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            overflow: hidden;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(139, 92, 246, 0.3);
        }

        .category-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .category-controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .category-name {
            font-size: 14px;
            color: #e0e7ff;
            font-weight: 500;
            min-height: 20px;
        }

        .category-arrows {
            display: flex;
            gap: 10px;
        }

        .arrow-btn {
            flex: 1;
            padding: 8px 15px;
            background: #1e293b;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #c4b5fd;
            transition: all 0.2s;
            font-size: 16px;
        }

        .arrow-btn:hover {
            background: #8b5cf6;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
        }

        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .arrow-btn:disabled:hover {
            background: #1e293b;
            color: #c4b5fd;
            transform: scale(1);
            box-shadow: none;
        }

        .loading {
            text-align: center;
            color: #c4b5fd;
            font-size: 18px;
            padding: 20px;
        }

        .female-toggle {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-label input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #8b5cf6;
        }

        .toggle-text {
            color: #e0e7ff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .toggle-hint {
            color: #a5b4fc;
            font-size: 14px;
            margin-top: 8px;
            font-style: italic;
            opacity: 0.8;
        }

        .footer-credit {
            text-align: center;
            color: #e0e7ff;
            font-size: 12px;
            margin-top: 20px;
            opacity: 0.4;
            font-style: italic;
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }

            .viewing-panel {
                position: static;
                width: 100%;
            }

            .canvas-container {
                width: 100%;
                max-width: 500px;
                height: auto;
                aspect-ratio: 1;
            }

            .categories-panel {
                max-height: none;
            }

            .mobile-toggle {
                display: block;
            }

            .categories-panel.collapsed {
                display: none;
            }

            .categories-panel.expanded {
                display: flex;
            }
        }

        @media (min-width: 1201px) {
            .categories-panel {
                display: flex !important;
            }
        }

        /* ===== ANIMATOR SCENE STYLES ===== */
        .animator-scene {
            width: 100%;
        }

        .animator-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .back-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateX(-3px);
        }

        .animator-header h2 {
            color: #e0e7ff;
            font-size: 2em;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .animator-content {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .animator-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .preview-container {
            width: 500px;
            height: 500px;
            border: 3px solid #8b5cf6;
            border-radius: 15px;
            overflow: hidden;
            background: #00ff00;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            position: relative;
        }

        #animatorCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .background-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .background-selector label {
            color: #c4b5fd;
            font-weight: bold;
        }

        .bg-btn {
            padding: 10px 20px;
            border: 2px solid #8b5cf6;
            background: #1e293b;
            color: #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .bg-btn:hover {
            background: #8b5cf6;
            transform: scale(1.05);
        }

        .bg-btn.active {
            background: #8b5cf6;
            border-color: #a78bfa;
        }

        .animator-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 700px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .animator-controls::-webkit-scrollbar {
            width: 8px;
        }

        .animator-controls::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }

        .animator-controls::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        .control-section {
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .control-section h3 {
            color: #c4b5fd;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-btn-sm {
            padding: 8px 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn-sm:hover {
            transform: scale(1.05);
        }

        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #timeline {
            width: 100%;
            background: #1e293b;
            border-radius: 8px;
            cursor: pointer;
        }

        #timelineScrubber {
            width: 100%;
            accent-color: #8b5cf6;
        }

        .timeline-time {
            color: #a5b4fc;
            text-align: center;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            color: #c4b5fd;
            font-weight: bold;
            font-size: 14px;
        }

        .control-group select {
            padding: 10px;
            background: #1e293b;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            color: #e0e7ff;
            font-size: 14px;
        }

        .keyframe-list {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .keyframe-list strong {
            color: #c4b5fd;
            display: block;
            margin-bottom: 10px;
        }

        #keyframesDisplay {
            color: #a5b4fc;
            font-size: 13px;
        }

        .keyframe-item {
            padding: 8px;
            background: #374151;
            border-radius: 6px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .keyframe-delete {
            background: #ef4444;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .export-video-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .export-video-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            width: 0%;
            transition: width 0.3s;
        }

        #progressText {
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 1200px) {
            .animator-content {
                flex-direction: column;
            }

            .preview-container {
                width: 100%;
                max-width: 500px;
                height: auto;
                aspect-ratio: 1;
            }

            .animator-controls {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨🍔 BigHead Character Cooker</h1>
        <button class="mobile-toggle" id="mobileToggle" onclick="toggleCategories()">
            📋 Show Categories
        </button>
        <div class="main-content">
            <div class="viewing-panel">
                <div class="canvas-container">
                    <canvas id="mainCanvas" width="1000" height="1000"></canvas>
                </div>
                <button class="export-btn" onclick="exportImage()">💾 Export PNG (1000x1000)</button>
                <button class="export-btn" onclick="switchToAnimator()" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); margin-top: 10px;">🎬 Animate Character</button>
            </div>
            <div class="categories-panel collapsed" id="categoriesPanel">
                <div class="loading">Loading images...</div>
            </div>
        </div>
        
        <!-- ANIMATOR SCENE (Hidden by default) -->
        <div class="animator-scene" id="animatorScene" style="display: none;">
            <div class="animator-header">
                <button class="back-btn" onclick="switchToCreator()">◀ Back to Character Creator</button>
                <h2>🎬 Character Animator</h2>
            </div>
            
            <div class="animator-content">
                <!-- Left: Preview Canvas -->
                <div class="animator-preview">
                    <div class="preview-container">
                        <canvas id="animatorCanvas" width="1000" height="1000"></canvas>
                    </div>
                    <div class="background-selector">
                        <label>Background:</label>
                        <button class="bg-btn active" onclick="setAnimBg('green')" data-bg="green">🟢 Green</button>
                        <button class="bg-btn" onclick="setAnimBg('blue')" data-bg="blue">🔵 Blue</button>
                        <button class="bg-btn" onclick="setAnimBg('black')" data-bg="black">⚫ Black</button>
                        <button class="bg-btn" onclick="setAnimBg('white')" data-bg="white">⚪ White</button>
                    </div>
                </div>
                
                <!-- Right: Controls -->
                <div class="animator-controls">
                    <!-- Audio Section -->
                    <div class="control-section">
                        <h3>📢 Audio</h3>
                        <div class="audio-controls">
                            <button class="control-btn" onclick="startRecording()">🎤 Record Audio</button>
                            <button class="control-btn" onclick="stopRecording()" disabled id="stopRecBtn">⏹️ Stop Recording</button>
                            <input type="file" id="audioUpload" accept="audio/*" onchange="loadAudioFile(event)" style="display: none;">
                            <button class="control-btn" onclick="document.getElementById('audioUpload').click()">📁 Upload Audio</button>
                        </div>
                        <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px; display: none;"></audio>
                        <div class="control-group" id="volumeControl" style="display: none; margin-top: 15px;">
                            <label>🔊 Audio Volume: <span id="volumeValue">100%</span></label>
                            <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1" 
                                   oninput="updateVolume(this.value)" 
                                   style="width: 100%; accent-color: #8b5cf6;">
                        </div>
                        <canvas id="waveform" width="600" height="80" style="width: 100%; margin-top: 10px; background: #1e293b; border-radius: 8px; display: none;"></canvas>
                    </div>
                    
                    <!-- Timeline Section -->
                    <div class="control-section" id="timelineSection" style="display: none;">
                        <h3>⏱️ Timeline</h3>
                        <div class="timeline-container">
                            <canvas id="timeline" width="600" height="100"></canvas>
                            <input type="range" id="timelineScrubber" min="0" max="100" value="0" step="0.1" style="width: 100%;">
                            <div class="timeline-time" id="timelineTime">0.00s / 0.00s</div>
                        </div>
                    </div>
                    
                    <!-- Animation Controls -->
                    <div class="control-section" id="animationSection" style="display: none;">
                        <h3>🎭 Animation Controls</h3>
                        
                        <div class="control-group">
                            <label class="toggle-label">
                                <input type="checkbox" id="autoLipSync" onchange="toggleAutoLipSync()" checked style="width: 20px; height: 20px; cursor: pointer; accent-color: #8b5cf6;">
                                <span style="color: #e0e7ff; font-weight: bold;">🤖 Auto Lip Sync (based on audio volume)</span>
                            </label>
                            <div style="color: #a5b4fc; font-size: 13px; margin-top: 5px; font-style: italic;">
                                Mouth automatically opens/closes with audio. Uncheck for manual control.
                            </div>
                            <div style="margin-top: 10px;">
                                <label style="color: #c4b5fd; font-size: 14px;">Lip Sync Style:</label>
                                <select id="lipSyncStyle" style="margin-left: 10px; padding: 5px; background: #374151; color: #e0e7ff; border: 1px solid #8b5cf6; border-radius: 5px; cursor: pointer;">
                                    <option value="ehh">Ehh (Default)</option>
                                    <option value="ooo">Ooo (Alternative)</option>
                                </select>
                            </div>
                        </div>

                        <div class="control-group" id="manualMouthControls" style="display: none;">
                            <label>Manual Mouth Shape:</label>
                            <select id="mouthSelect" onchange="setMouthShape()">
                                <option value="Mmm.png">Closed (Mmm)</option>
                                <option value="Ahh.png">Open (Ahh)</option>
                                <option value="Ooo.png">Round (Ooo)</option>
                                <option value="Eee.png">Wide (Eee)</option>
                                <option value="Fff.png">Lips (Fff)</option>
                                <option value="LLL.png">L Sound</option>
                                <option value="Thh.png">Th Sound</option>
                            </select>
                            <button class="control-btn-sm" onclick="addMouthKeyframe()">➕ Add Keyframe</button>
                        </div>
                        
                        <div class="control-group">
                            <label>Blinks & Eyes:</label>
                            <button class="control-btn-sm" onclick="addBlinkKeyframe()">👁️ Add Blink</button>
                            <select id="eyesSelect" onchange="setEyeExpression()">
                                <option value="current">Keep Current Eyes</option>
                                <option value="Curious.png">Curious</option>
                                <option value="Surprised.png">Surprised</option>
                                <option value="Joy.png">Joy</option>
                                <option value="Grumpy.png">Grumpy</option>
                                <option value="Annoyed.png">Annoyed</option>
                                <option value="Stern.png">Stern</option>
                            </select>
                            <button class="control-btn-sm" onclick="addEyeKeyframe()">➕ Add Expression</button>
                        </div>
                        
                        <div class="keyframe-list" id="keyframeList">
                            <strong>Keyframes:</strong>
                            <div id="keyframesDisplay">No keyframes yet</div>
                        </div>
                    </div>
                    
                    <!-- Export Section -->
                    <div class="control-section" id="exportSection" style="display: none;">
                        <h3>📤 Export</h3>
                        <button class="control-btn export-video-btn" onclick="exportVideo()">🎥 Export Video</button>
                        <div id="exportProgress" style="display: none; margin-top: 10px; color: #a5b4fc;">
                            <div class="progress-bar">
                                <div id="progressFill"></div>
                            </div>
                            <div id="progressText">Preparing export...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer-credit">V2.2 Created By BHaleyArt</div>

            // Check if this category has a "None.png" option
            const noneIndex = imageData[category].findIndex(filename => 
                filename.toLowerCase() === 'none.png'
            );
            
            // Set to "None" if it exists, otherwise default to 0

            state.loadedImages[category] = [];

        // Preload all images
        async function preloadImages() {
            const promises = [];
            let successCount = 0;
            let failCount = 0;
            
            for (const category of layerOrder) {
                const categoryImages = imageData[category];
                
                // Use "GIRL" folder for female-only categories, otherwise use category name
                const folderName = femaleOnlyCategories.includes(category) ? 'GIRL' : category;
                
                for (let i = 0; i < categoryImages.length; i++) {
                    const promise = new Promise((resolve, reject) => {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => {
                            state.loadedImages[category][i] = img;
                            successCount++;
                            console.log(`✓ Loaded: ${folderName}/${categoryImages[i]}`);
                            resolve();
                        };
                        img.onerror = () => {
                            failCount++;
                            console.error(`✗ FAILED to load: ${folderName}/${categoryImages[i]}`);
                            state.loadedImages[category][i] = null;
                            resolve(); // Resolve anyway to continue
                        };
                        img.src = `${folderName}/${categoryImages[i]}`;
                    });
                    promises.push(promise);
                }
            }

            await Promise.all(promises);
            console.log(`\n=== IMAGE LOADING COMPLETE ===`);
            console.log(`Success: ${successCount} images`);
            console.log(`Failed: ${failCount} images`);
            console.log(`==============================\n`);
        }

        // Render the character
        function renderCharacter() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw layers in reverse order (background first, eyes last)
            for (let i = layerOrder.length - 1; i >= 0; i--) {
                const category = layerOrder[i];
                
                // Skip female-only categories if female mode is off
                if (femaleOnlyCategories.includes(category) && !state.femaleMode) {
                    continue;
                }
                
                const index = state.currentIndices[category];
                const img = state.loadedImages[category][index];

                if (img) {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                }
            }
        }

            const img = state.loadedImages[category][index];
            const filename = imageData[category][index];

            if (preview && img) {
                preview.innerHTML = `<img src="${img.src}" alt="${category}">`;

            if (nameDisplay) {
                nameDisplay.textContent = filename ? filename.replace('.png', '') : 'None';

            const prevBtn = document.querySelector(`#prev-${category}`);
            const nextBtn = document.querySelector(`#next-${category}`);
            const index = state.currentIndices[category];
            const maxIndex = imageData[category].length - 1;

            if (prevBtn) {
                prevBtn.disabled = index === 0;
            }
            if (nextBtn) {
                nextBtn.disabled = index === maxIndex;
            }
        }

        // Navigate category
        function navigateCategory(category, direction) {
            const currentIndex = state.currentIndices[category];
            const maxIndex = imageData[category].length - 1;
            let newIndex = currentIndex + direction;

            // Clamp to valid range
            if (newIndex < 0) newIndex = 0;
            if (newIndex > maxIndex) newIndex = maxIndex;

            state.currentIndices[category] = newIndex;
            updateCategoryPreview(category);
            renderCharacter();
        }

            switch(type) {

            renderAnimatorFrame();

        // Audio Recording
        function startRecording() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    animatorState.mediaRecorder = new MediaRecorder(stream);
                    animatorState.audioChunks = [];
                    
                    animatorState.mediaRecorder.ondataavailable = (event) => {
                        animatorState.audioChunks.push(event.data);
                    };
                    
                    animatorState.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(animatorState.audioChunks, { type: 'audio/wav' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audioPlayer = document.getElementById('audioPlayer');
                        audioPlayer.src = audioUrl;
                        audioPlayer.style.display = 'block';
                        
                        // Process audio for waveform
                        processAudioFile(audioBlob);
                        
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    animatorState.mediaRecorder.start();
                    animatorState.isRecording = true;
                    
                    document.getElementById('stopRecBtn').disabled = false;
                    event.target.disabled = true;
                })
                .catch(err => {
                    alert('Could not access microphone: ' + err.message);
                });
        }

        function stopRecording() {
            if (animatorState.mediaRecorder && animatorState.isRecording) {
                animatorState.mediaRecorder.stop();
                animatorState.isRecording = false;
                document.getElementById('stopRecBtn').disabled = true;
                document.querySelector('[onclick="startRecording()"]').disabled = false;
            }
        }

        // Load audio file
        function loadAudioFile(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.src = url;
                audioPlayer.style.display = 'block';
                
                processAudioFile(file);
            }
        }

        // Process audio file for waveform
        function processAudioFile(audioBlob) {
            const reader = new FileReader();
            reader.onload = function(e) {
                if (!animatorState.audioContext) {
                    animatorState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                animatorState.audioContext.decodeAudioData(e.target.result, (buffer) => {
                    animatorState.audioBuffer = buffer;
                    animatorState.audioDuration = buffer.duration;
                    
                    // Extract waveform data
                    const rawData = buffer.getChannelData(0);
                    const samples = 600; // Width of waveform canvas
                    const blockSize = Math.floor(rawData.length / samples);
                    const waveformData = [];
                    
                    for (let i = 0; i < samples; i++) {
                        let sum = 0;
                        for (let j = 0; j < blockSize; j++) {
                            sum += Math.abs(rawData[(i * blockSize) + j]);
                        }
                        waveformData.push(sum / blockSize);
                    }
                    
                    animatorState.waveformData = waveformData;
                    drawWaveform();
                    
                    // Show timeline and animation controls
                    document.getElementById('timelineSection').style.display = 'block';
                    document.getElementById('animationSection').style.display = 'block';
                    document.getElementById('exportSection').style.display = 'block';
                    document.getElementById('volumeControl').style.display = 'block';
                    
                    // Setup timeline
                    const scrubber = document.getElementById('timelineScrubber');
                    scrubber.max = animatorState.audioDuration;
                    scrubber.value = 0;
                    updateTimelineDisplay();
                    
                    // Setup audio player listener for auto lip sync
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.addEventListener('timeupdate', () => {
                        animatorState.currentTime = audioPlayer.currentTime;
                        scrubber.value = audioPlayer.currentTime;
                        updateTimelineDisplay();
                        
                        // Calculate current volume for auto lip sync
                        if (animatorState.autoLipSync && animatorState.audioBuffer) {
                            const sampleRate = animatorState.audioBuffer.sampleRate;
                            const currentSample = Math.floor(audioPlayer.currentTime * sampleRate);
                            const windowSize = Math.floor(sampleRate * 0.02); // 20ms window (reduced from 50ms for more sensitivity)
                            
                            const channelData = animatorState.audioBuffer.getChannelData(0);
                            let sum = 0;
                            for (let i = 0; i < windowSize && currentSample + i < channelData.length; i++) {
                                sum += Math.abs(channelData[currentSample + i]);
                            }
                            animatorState.currentVolume = sum / windowSize;
                        }
                        
                        renderAnimatorFrame();
                    });
                });
            };
            reader.readAsArrayBuffer(audioBlob);
        }

        // Draw waveform
        function drawWaveform() {
            const canvas = document.getElementById('waveform');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, width, height);
            
            if (!animatorState.waveformData) return;
            
            const data = animatorState.waveformData;
            const barWidth = width / data.length;
            
            ctx.fillStyle = '#8b5cf6';
            for (let i = 0; i < data.length; i++) {
                const barHeight = data[i] * height * 0.8;
                const x = i * barWidth;
                const y = (height - barHeight) / 2;
                ctx.fillRect(x, y, barWidth - 1, barHeight);
            }
        }

        // Timeline scrubber
        document.addEventListener('DOMContentLoaded', () => {
            const scrubber = document.getElementById('timelineScrubber');
            if (scrubber) {
                scrubber.addEventListener('input', (e) => {
                    animatorState.currentTime = parseFloat(e.target.value);
                    updateTimelineDisplay();
                    
                    const audioPlayer = document.getElementById('audioPlayer');
                    if (audioPlayer && !audioPlayer.paused) {
                        audioPlayer.pause();
                    }
                    if (audioPlayer) {
                        audioPlayer.currentTime = animatorState.currentTime;
                    }
                    
                    renderAnimatorFrame();
                });
            }
        });

        function updateTimelineDisplay() {
            const timeDisplay = document.getElementById('timelineTime');
            if (timeDisplay) {
                timeDisplay.textContent = `${animatorState.currentTime.toFixed(2)}s / ${animatorState.audioDuration.toFixed(2)}s`;

        // Add mouth keyframe
        function addMouthKeyframe() {
            const select = document.getElementById('mouthSelect');
            const mouthShape = select.value;
            
            animatorState.keyframes.push({
                time: animatorState.currentTime,
                type: 'mouth',

        // Add blink keyframe
        function addBlinkKeyframe() {
            animatorState.keyframes.push({
                time: animatorState.currentTime,
                type: 'blink',
                value: 'Blink.png',
                duration: 0.1 // Blink lasts 0.1 seconds
            });
            
            sortAndDisplayKeyframes();
        }

        // Add eye expression keyframe
        function addEyeKeyframe() {
            const select = document.getElementById('eyesSelect');
            if (select.value === 'current') return;
            
            // Automatically add a blink keyframe 0.1 seconds before the eye change
            const blinkTime = Math.max(0, animatorState.currentTime - 0.1);
            
            // Check if there's already a blink at this time to avoid duplicates
            const hasBlinkAtTime = animatorState.keyframes.some(kf => 
                kf.type === 'blink' && Math.abs(kf.time - blinkTime) < 0.05
            );
            
            if (!hasBlinkAtTime) {
                animatorState.keyframes.push({
                    time: blinkTime,
                    type: 'blink',
                    value: 'Blink.png',
                    duration: 0.1
                });
            }
            
            // Add the eye change keyframe
            animatorState.keyframes.push({
                time: animatorState.currentTime,
                type: 'eyes',
                value: select.value
            });
            
            sortAndDisplayKeyframes();
        }

        // Sort and display keyframes
        function sortAndDisplayKeyframes() {
            animatorState.keyframes.sort((a, b) => a.time - b.time);
            
            const display = document.getElementById('keyframesDisplay');
            if (animatorState.keyframes.length === 0) {
                display.innerHTML = 'No keyframes yet';
                return;
            }
            
            let html = '';
            animatorState.keyframes.forEach((kf, index) => {
                const icon = kf.type === 'mouth' ? '👄' : kf.type === 'blink' ? '👁️' : '😀';
                const name = kf.value.replace('.png', '');
                html += `
                    <div class="keyframe-item">
                        <span>${icon} ${kf.time.toFixed(2)}s - ${name}</span>
                        <button class="keyframe-delete" onclick="deleteKeyframe(${index})">❌</button>
                    </div>
                `;
            });
            display.innerHTML = html;
        }

        // Delete keyframe
        function deleteKeyframe(index) {
            animatorState.keyframes.splice(index, 1);
            sortAndDisplayKeyframes();
        }

        // Render animator frame
        function renderAnimatorFrame() {
            const canvas = document.getElementById('animatorCanvas');
            const ctx = canvas.getContext('2d');
            
            // Set background color
            let bgColor;
            switch(animatorState.backgroundType) {
                case 'green':
                    bgColor = '#00ff00';
                    break;
                case 'blue':
                    bgColor = '#0000ff';
                    break;
                case 'black':
                    bgColor = '#000000';
                    break;
                case 'white':
                    bgColor = '#ffffff';
                    break;
                default:
                    bgColor = '#00ff00';
            }
            
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Find active keyframes at current time
            let activeMouth = null;
            let activeEyes = null;
            let shouldBlink = false;
            
            for (const kf of animatorState.keyframes) {
                if (kf.type === 'blink' && 
                    animatorState.currentTime >= kf.time && 
                    animatorState.currentTime <= kf.time + (kf.duration || 0.1)) {
                    shouldBlink = true;
                } else if (kf.type === 'mouth' && kf.time <= animatorState.currentTime) {
                    activeMouth = kf.value;
                } else if (kf.type === 'eyes' && kf.time <= animatorState.currentTime) {
                    activeEyes = kf.value;
                }
            }
            
            // Auto lip sync based on volume
            if (animatorState.autoLipSync && !activeMouth && !currentMouthOverride) {
                const volume = animatorState.currentVolume;
                
                // Get selected lip sync style
                const lipSyncStyle = document.getElementById('lipSyncStyle')?.value || 'ehh';
                const mediumMouth = lipSyncStyle === 'ooo' ? 'Ooo.png' : 'Ehh.png';
                
                // Map volume to mouth shapes
                // Adjusted thresholds for more sensitivity and frequent changes
                if (volume > 0.12) {
                    activeMouth = 'Ahh.png'; // Wide open for loud sounds
                } else if (volume > 0.05) {
                    activeMouth = mediumMouth; // Medium open (Ehh or Ooo based on style)
                } else if (volume > 0.02) {
                    activeMouth = 'Eee.png'; // Slight open
                } else {
                    activeMouth = 'Mmm.png'; // Closed for silence
                }
            }
            
            // Apply manual overrides (only if auto lip sync is off)
            if (!animatorState.autoLipSync && currentMouthOverride) {
                activeMouth = currentMouthOverride;
            }
            
            if (currentEyeOverride) activeEyes = currentEyeOverride;
            if (shouldBlink) activeEyes = 'Blink.png';
            
            // Draw layers
            for (let i = layerOrder.length - 1; i >= 0; i--) {
                const category = layerOrder[i];
                
                // Skip female-only categories if not in female mode
                if (femaleOnlyCategories.includes(category) && !state.femaleMode) {
                    continue;
                }
                
                // Use active keyframe values if available
                let index = state.currentIndices[category];
                
                if (category === 'MOUTH' && activeMouth) {
                    const mouthIndex = imageData.MOUTH.findIndex(m => m === activeMouth);
                    if (mouthIndex !== -1) index = mouthIndex;
                }
                
                if (category === 'EYES' && activeEyes) {
                    const eyeIndex = imageData.EYES.findIndex(e => e === activeEyes);
                    if (eyeIndex !== -1) index = eyeIndex;
                }
                
                const img = state.loadedImages[category][index];
                
                if (img && category !== 'BACKGROUNDS') { // Skip background layer
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                }
            }
        }

        // Export video
        async function exportVideo() {
            const canvas = document.getElementById('animatorCanvas');
            const audioPlayer = document.getElementById('audioPlayer');
            
            if (!animatorState.audioBuffer) {
                alert('Please load audio first!');
                return;
            }
            
            // Show progress
            const progressDiv = document.getElementById('exportProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressDiv.style.display = 'block';
            progressText.textContent = 'Preparing export...';
            
            // Create MediaRecorder stream
            const stream = canvas.captureStream(30); // 30 fps
            
            // Add audio track - works with both recorded and uploaded audio
            if (audioPlayer.captureStream) {
                try {
                    const audioStream = audioPlayer.captureStream();
                    const audioTrack = audioStream.getAudioTracks()[0];
                    if (audioTrack) {
                        stream.addTrack(audioTrack);
                    }
                } catch (err) {
                    console.log('captureStream not supported, audio will still be captured during playback');
                }
            }
            
            // Try MP4 first, fallback to WebM if not supported
            let mimeType = 'video/mp4';
            let extension = 'mp4';
            
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                // Try H.264 in MP4
                mimeType = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    // Fallback to WebM with VP9
                    mimeType = 'video/webm;codecs=vp9,opus';
                    extension = 'webm';
                    console.log('MP4 not supported, using WebM');
                }
            }
            
            const chunks = [];
            const recorder = new MediaRecorder(stream, {
                mimeType: mimeType,
                videoBitsPerSecond: 5000000 // 5 Mbps for good quality
            });
            
            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    chunks.push(e.data);
                }
            };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `character-animation-${Date.now()}.${extension}`;
                a.click();
                
                progressDiv.style.display = 'none';
                alert(`Video exported successfully as ${extension.toUpperCase()} with audio!`);
            };
            
            // Start recording
            recorder.start();
            progressText.textContent = 'Recording video...';
            
            // Play through animation
            audioPlayer.currentTime = 0;
            animatorState.currentTime = 0;
            audioPlayer.play();
            
            // Update progress
            const updateProgress = setInterval(() => {
                const progress = (animatorState.currentTime / animatorState.audioDuration) * 100;
                progressFill.style.width = progress + '%';
                progressText.textContent = `Recording: ${Math.round(progress)}%`;
            }, 100);
            
            // Stop recording when audio ends
            audioPlayer.onended = () => {
                clearInterval(updateProgress);
                recorder.stop();
                stream.getTracks().forEach(track => track.stop());
            };
        }
    </script>
